<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>下载时长计算器</title>
<style>
  :root{
    --text: #eef2ff;
    --muted: #8b93b8;
    --stroke: rgba(255,255,255,.10);
    --accent: #8b5cf6;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{ min-height: 100%; }

  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 600px at 8% 0%,  rgba(79,70,229,.48), transparent 60%),
      radial-gradient(800px 620px at 96% 100%, rgba(219,39,119,.34), transparent 60%),
      radial-gradient(700px 520px at 82% 6%,  rgba(34,211,238,.16), transparent 60%),
      #0b0e1d;
    background-attachment: fixed;
  }

  /* ===== 卡片 ===== */
  .card{
    width: min(620px, 100%);
    padding: 40px 36px 34px;
    border-radius: 32px;
    background: linear-gradient(160deg, rgba(255,255,255,.095), rgba(255,255,255,.032));
    border: 1px solid var(--stroke);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,.85),
      inset 0 1px 0 rgba(255,255,255,.13);
    animation: rise .6s cubic-bezier(.2,.8,.25,1) both;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(18px) scale(.98); }
    to  { opacity: 1; transform: none; }
  }

  h1{
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .01em;
  }

  /* ===== 输入区 ===== */
  .inputs{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .field{
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 18px 12px;
    border-radius: 20px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.09);
    transition: border-color .25s, box-shadow .25s, background .25s;
    cursor: text;
  }

  .field:focus-within{
    background: rgba(255,255,255,.085);
    border-color: rgba(139,92,246,.75);
    box-shadow: 0 0 0 4px rgba(139,92,246,.18);
  }

  .field > span{
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--muted);
  }

  /* 输入框 + 单位行 */
  .input-wrap{
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .input-wrap input{
    width: 100%;
    min-width: 0;
    border: 0;
    outline: 0;
    padding: 0;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .01em;
  }

  .input-wrap input::placeholder{ color: rgba(139,147,184,.5); }

  .unit{
    flex: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--muted);
    opacity: .95;
  }

  /* 隐藏数字输入框的上下箭头 */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance: none;
    margin: 0;
  }
  input[type=number]{ appearance: textfield; -moz-appearance: textfield; }

  /* ===== 结果区 ===== */
  .result{
    position: relative;
    padding: 20px 24px 22px;
    border-radius: 26px;
    background: rgba(0,0,0,.30);
    border: 1px solid rgba(255,255,255,.07);
    overflow: hidden;
  }

  .result::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(139,92,246,.20), transparent 58%);
    pointer-events: none;
  }

  /* 主结果 A */
  .main-result{
    margin-top: 24px;
    background: rgba(0,0,0,.34);
  }

  /* 次要结果 B、C 并排 */
  .results-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 14px;
  }

  .result .label{
    position: relative;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .05em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 数值 + 输出单位 */
  .value-line{
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-top: 9px;
    flex-wrap: wrap;
  }

  .value{
    font-size: clamp(32px, 9vw, 52px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -.02em;
    word-break: break-all;
    background: linear-gradient(100deg, #7dd3fc, #a78bfa 45%, #f0abfc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* B、C 字号稍小 */
  .value.small{
    font-size: clamp(19px, 4.6vw, 28px);
    letter-spacing: -.01em;
  }

  .out-unit{
    flex: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--muted);
  }

  .value.small + .out-unit{
    font-size: 13px;
  }

  .value.pop{ animation: pop .36s cubic-bezier(.2,.8,.25,1); }

  @keyframes pop{
    0%  { transform: scale(1);    }
    45% { transform: scale(1.045); }
    100%{ transform: scale(1);    }
  }

  .hint{
    margin: 14px 4px 0;
    min-height: 18px;
    font-size: 13px;
    color: #fca5a5;
    transition: opacity .2s;
  }

  /* ===== 小屏适配 ===== */
  @media (max-width: 480px){
    .card{ padding: 32px 20px 28px; border-radius: 28px; }
    h1{ font-size: 20px; }
    
    .inputs{ gap: 10px; }
    .field{ padding: 12px 14px 10px; }
    .field > span { font-size: 11px; }
    .input-wrap input{ font-size: 20px; }
    
    .results-grid { gap: 10px; }
    .result { padding: 16px 18px 18px; }
    
    .value{ font-size: clamp(26px, 8vw, 36px); }
    .value.small{ font-size: clamp(16px, 5vw, 22px); }
  }
</style>
</head>
<body>

  <main class="card">
    <h1>下载时长计算器</h1>

    <div class="inputs">
      <label class="field">
        <span>大小 (G)</span>
        <div class="input-wrap">
          <input id="m" type="number" step="any" value="1" placeholder="0" autocomplete="off" />
          <span class="unit">G</span>
        </div>
      </label>
      <label class="field">
        <span>速度 (MB/s)</span>
        <div class="input-wrap">
          <input id="n" type="number" step="any" value="1" placeholder="0" autocomplete="off" />
          <span class="unit">MB/s</span>
        </div>
      </label>
    </div>

    <!-- 主结果 A -->
    <div class="result main-result">
      <div class="label">时</div>
      <div class="value-line">
        <div class="value" id="outA">—</div>
        <span class="out-unit">h</span>
      </div>
    </div>

    <!-- 次要结果 B、C -->
    <div class="results-grid">
      <div class="result">
        <div class="label">分</div>
        <div class="value-line">
          <div class="value small" id="outB">—</div>
          <span class="out-unit">min</span>
        </div>
      </div>
      <div class="result">
        <div class="label">秒</div>
        <div class="value-line">
          <div class="value small" id="outC">—</div>
          <span class="out-unit">s</span>
        </div>
      </div>
    </div>

    <p class="hint" id="hint"></p>
  </main>

<script>
  const mEl  = document.getElementById('m');
  const nEl  = document.getElementById('n');
  const hint = document.getElementById('hint');

  const slots = {
    A: { el: document.getElementById('outA'), last: null },
    B: { el: document.getElementById('outB'), last: null },
    C: { el: document.getElementById('outC'), last: null }
  };

  // === 核心修改：格式化函数，四舍五入保留2位小数 ===
  function fmt(x){
    if (!isFinite(x)) return '—';
    if (x === 0) return '0.00';

    // 如果值非常小（大于0但小于0.01），避免显示成 0.00 引起误解
    if (x > 0 && x < 0.01) return '< 0.01';
    if (x < 0 && x > -0.01) return '> -0.01';

    const abs = Math.abs(x);
    // 正常范围内，使用 toLocaleString 进行四舍五入并保留两位小数（自带千分位逗号）
    if (abs >= 0.01 && abs < 1e10){
      return x.toLocaleString('zh-CN', { 
        minimumFractionDigits: 2, 
        maximumFractionDigits: 2 
      });
    }

    // 极大值仍然使用科学计数法
    const [mant, exp] = x.toExponential(2).split('e');
    return mant + '×10^' + Number(exp);
  }

  function setValue(key, text){
    const slot = slots[key];
    if (text === slot.last) return;
    slot.last = text;

    slot.el.textContent = text;
    slot.el.classList.remove('pop');
    void slot.el.offsetWidth;
    slot.el.classList.add('pop');
  }

  function setAll(text){
    setValue('A', text);
    setValue('B', text);
    setValue('C', text);
  }

  function update(){
    hint.textContent = '';

    const mv = mEl.value.trim();
    const nv = nEl.value.trim();

    if (mv === '' || nv === ''){
      setAll('—');
      return;
    }

    const m = Number(mv);
    const n = Number(nv);

    if (!Number.isFinite(m) || !Number.isFinite(n)){
      setAll('—');
      hint.textContent = '请输入有效的数字';
      return;
    }

    if (n === 0){
      setAll('—');
      hint.textContent = '速度不能为 0';
      return;
    }

    const C = m * 1024 / n;          // 秒
    const B = C / 60;                // 分
    const A = B / 60;                // 时

    setValue('A', fmt(A));
    setValue('B', fmt(B));
    setValue('C', fmt(C));
  }

  mEl.addEventListener('input', update);
  nEl.addEventListener('input', update);

  update();
</script>

</body>
</html>

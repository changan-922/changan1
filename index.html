<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模电数电大岗 · 知识树</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#0d1117;color:#e6edf3;font-size:15px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#2b333e;border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:#3d4855}
  ::-webkit-scrollbar-track{background:transparent}

  .app{display:flex;height:100vh;overflow:hidden}

  /* ---------- 侧边栏 ---------- */
  .sidebar{
    width:272px;flex:none;background:#0f141b;border-right:1px solid #1e252e;
    padding:22px 14px 40px;overflow-y:auto;
  }
  .brand{margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:.5px;
    background:linear-gradient(90deg,#7aa2f7,#5dd39e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand-sub{font-size:11.5px;color:#6b7787;margin:0 0 18px;letter-spacing:.6px}
  .toc-title{font-size:11px;color:#5d6774;letter-spacing:1.4px;margin:0 0 8px;padding-left:8px}
  .toc{display:flex;flex-direction:column;gap:2px}
  .toc a{
    display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;
    font-size:13px;color:#9aa7b8;transition:.15s;border:1px solid transparent;
  }
  .toc a:hover{background:#161d26;color:#e6edf3}
  .toc a .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;
    box-shadow:0 0 8px var(--c)}
  .toc a .num{margin-left:auto;font-size:10.5px;color:#55606f;
    background:#161d26;border-radius:20px;padding:1px 7px}
  .toc a:hover .num{color:#8b98ab}

  /* ---------- 主区 ---------- */
  main{flex:1;overflow-y:auto;position:relative;scroll-behavior:smooth}
  .toolbar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 22px;background:rgba(13,17,23,.86);backdrop-filter:blur(14px);
    border-bottom:1px solid #1e252e;
  }
  .search-wrap{position:relative;flex:1;min-width:180px;max-width:340px}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;stroke:#5d6774;fill:none;stroke-width:2}
  #search{
    width:100%;padding:8px 12px 8px 33px;border-radius:9px;border:1px solid #232c37;
    background:#111721;color:#e6edf3;font-size:13.5px;outline:none;transition:.18s;
    font-family:inherit;
  }
  #search:focus{border-color:#3d5a99;background:#141b26;box-shadow:0 0 0 3px rgba(122,162,247,.12)}
  #search::placeholder{color:#525d6c}
  .btn{
    padding:7px 13px;border-radius:8px;border:1px solid #232c37;background:#131a24;
    color:#9aa7b8;font-size:12.5px;cursor:pointer;transition:.15s;font-family:inherit;
    white-space:nowrap;
  }
  .btn:hover{background:#1a232f;color:#e6edf3;border-color:#33404f}
  .btn:active{transform:translateY(1px)}
  .stat{margin-left:auto;font-size:12px;color:#5d6774;white-space:nowrap}
  .stat b{color:#7aa2f7;font-weight:600}

  /* ---------- 树 ---------- */
  #tree{padding:18px 22px 120px;max-width:1180px}
  .node{position:relative}
  .row{
    position:relative;display:flex;align-items:flex-start;gap:7px;
    padding:5px 9px;border-radius:7px;transition:background .13s;
    cursor:default;line-height:1.62;
  }
  .row:hover{background:rgba(255,255,255,.042)}
  .toggle{
    width:14px;flex:none;font-size:9px;line-height:1.9;color:#4e5a69;
    transition:transform .18s ease;user-select:none;
  }
  .node.has-kids > .row{cursor:pointer}
  .node.has-kids > .row .toggle{color:#6f7d8f}
  .node:not(.collapsed) > .row > .toggle{transform:rotate(90deg)}
  .node.has-kids > .row:hover .toggle{color:#7aa2f7}
  .label{flex:1;min-width:0}
  .badge{
    flex:none;font-size:10px;color:#525d6c;background:#151c26;
    border-radius:20px;padding:1px 7px;margin-top:3px;transition:.15s;
  }
  .node.collapsed > .row .badge{background:#1c2634;color:#7aa2f7}

  .children{
    margin-left:7px;padding-left:18px;border-left:1px dashed #212a35;
  }
  .node.collapsed > .children{display:none}
  .children > .node > .row::before{
    content:'';position:absolute;left:-19px;top:16px;width:13px;height:1px;
    background:#212a35;
  }

  /* 层级样式 */
  .node[data-level="0"] > .row{
    font-size:15.5px;font-weight:700;letter-spacing:.3px;color:var(--c);
    margin-top:20px;margin-bottom:2px;padding:9px 12px;
    border-left:3px solid var(--c);border-radius:0 8px 8px 0;
    background:linear-gradient(90deg,color-mix(in srgb,var(--c) 15%,transparent),transparent 62%);
  }
  .node[data-level="0"] > .row .badge{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
  .node[data-level="1"] > .row{font-size:14px;font-weight:600;color:#cfd9e6}
  .node[data-level="2"] > .row{font-size:13.5px;color:#a9b6c8}
  .node[data-level="3"] > .row{font-size:13px;color:#8e9cb0}
  .node[data-level="4"] > .row{font-size:12.5px;color:#7f8da1}

  /* 叶子节点小圆点 */
  .node.no-kids > .row > .toggle::after{
    content:'';display:block;width:4px;height:4px;border-radius:50%;
    background:#3a4553;margin:9px auto 0;
  }
  .node[data-level="0"].no-kids > .row > .toggle::after{background:var(--c)}

  /* 搜索状态 */
  .node.hidden{display:none}
  .tree.filtering .node.auto-open > .children{display:block}
  .tree.filtering .row .label mark{background:rgba(247,185,85,.28);color:#f7b955;border-radius:3px;padding:0 1px}
  .empty{
    display:none;padding:60px 20px;text-align:center;color:#5d6774;font-size:13.5px;
  }
  .empty.show{display:block}

  @media (max-width:820px){
    html,body{height:auto}
    body{overflow:auto}
    .app{flex-direction:column;height:auto;overflow:visible}
    .sidebar{
      width:100%;border-right:none;border-bottom:1px solid #1e252e;
      padding:14px 12px 10px;
    }
    .brand-sub{margin-bottom:12px}
    .toc-title{display:none}
    .toc{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
    .toc a{flex:none;white-space:nowrap;font-size:12.5px;background:#131a24}
    .toc a .num{display:none}
    main{overflow:visible}
    .toolbar{padding:10px 14px}
    .stat{margin-left:0;width:100%;order:5}
    #tree{padding:12px 12px 90px}
    .children{padding-left:13px}
    .children > .node > .row::before{left:-14px;width:9px}
  }
</style>
</head>

/* ============================================================
   渲染
   ============================================================ */
const PALETTE = ['#7aa2f7', '#f7b955', '#5dd39e', '#f27a7a', '#bb9af7', '#4dd0e1', '#f06292', '#a3d977'];
const treeEl  = document.getElementById('tree');
const tocEl   = document.getElementById('toc');
const statEl  = document.getElementById('stat');
const emptyEl = document.getElementById('empty');
const searchEl= document.getElementById('search');

let nodeSeq = 0;

function renderNodes(nodes, container, level, color) {
  nodes.forEach(item => {
    const hasKids = !!(item.c && item.c.length);
    const node = document.createElement('div');
    node.className = 'node ' + (hasKids ? 'has-kids' : 'no-kids');
    node.dataset.level = level;
    node.id = 'n' + (nodeSeq++);
    if (color) node.style.setProperty('--c', color);

    const row = document.createElement('div');
    row.className = 'row';

    const toggle = document.createElement('span');
    toggle.className = 'toggle';
    if (hasKids) toggle.textContent = '▶';

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = item.t;

    row.appendChild(toggle);
    row.appendChild(label);

    if (hasKids) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = item.c.length;
      row.appendChild(badge);

      row.addEventListener('click', () => node.classList.toggle('collapsed'));
    }

    node.appendChild(row);

    if (hasKids) {
      const kids = document.createElement('div');
      kids.className = 'children';
      renderNodes(item.c, kids, level + 1, null);
      node.appendChild(kids);
    }

    container.appendChild(node);
  });
}

function buildTree() {
  renderNodes(DATA, treeEl, 0, null);
  // 给顶层节点上色 + 记录锚点
  const tops = treeEl.querySelectorAll(':scope > .node');
  tops.forEach((n, i) => {
    const c = PALETTE[i % PALETTE.length];
    n.style.setProperty('--c', c);
    n.querySelector(':scope > .row').style.setProperty('--c', c);
    n.id = 'sec-' + i;
  });
}

function buildToc() {
  DATA.forEach((item, i) => {
    const a = document.createElement('a');
    a.style.setProperty('--c', PALETTE[i % PALETTE.length]);
    a.innerHTML = `<span class="dot"></span><span>${item.t}</span>
                    <span class="num">${countAll(item.c || [])}</span>`;
    a.href = '#sec-' + i;
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById('sec-' + i);
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      target.classList.remove('collapsed');
    });
    tocEl.appendChild(a);
  });
}

function countAll(nodes) {
  let n = 0;
  for (const x of nodes) { n++; if (x.c) n += countAll(x.c); }
  return n;
}

/* ============================================================
   搜索过滤
   ============================================================ */
function applyFilter(raw) {
  const kw = raw.trim().toLowerCase();
  const all = Array.from(treeEl.querySelectorAll('.node'));

  if (!kw) {
    treeEl.classList.remove('filtering');
    all.forEach(n => {
      n.classList.remove('hidden', 'auto-open');
      const lb = n.querySelector(':scope > .row > .label');
      if (lb.dataset.orig) lb.textContent = lb.dataset.orig;
    });
    emptyEl.classList.remove('show');
    return;
  }

  treeEl.classList.add('filtering');
  all.forEach(n => n.classList.remove('hidden', 'auto-open'));

  // 自底向上标记
  for (let i = all.length - 1; i >= 0; i--) {
    const n = all[i];
    const lb = n.querySelector(':scope > .row > .label');
    const text = lb.textContent;
    const selfMatch = text.toLowerCase().includes(kw);

    let childMatch = false;
    n.querySelectorAll(':scope > .children > .node').forEach(k => {
      if (!k.classList.contains('hidden')) childMatch = true;
    });

    if (!selfMatch && !childMatch) {
      n.classList.add('hidden');
    } else if (childMatch) {
      n.classList.add('auto-open');
    }
  }

  // 高亮
  all.forEach(n => {
    const lb = n.querySelector(':scope > .row > .label');
    if (!lb.dataset.orig) lb.dataset.orig = lb.textContent;
    if (n.classList.contains('hidden')) {
      lb.textContent = lb.dataset.orig;
      return;
    }
    const orig = lb.dataset.orig;
    const idx = orig.toLowerCase().indexOf(kw);
    if (idx === -1) { lb.textContent = orig; return; }
    lb.innerHTML = '';
    lb.append(
      document.createTextNode(orig.slice(0, idx)),
      Object.assign(document.createElement('mark'), { textContent: orig.slice(idx, idx + kw.length) }),
      document.createTextNode(orig.slice(idx + kw.length))
    );
  });

  const anyVisible = !!treeEl.querySelector('.node[data-level="0"]:not(.hidden)');
  emptyEl.classList.toggle('show', !anyVisible);
}

/* ============================================================
   初始化
   ============================================================ */
buildTree();
buildToc();

const total = countAll(DATA);
statEl.innerHTML = `共 <b>${total}</b> 个知识点 · <b>${DATA.length}</b> 大模块`;

searchEl.addEventListener('input', e => applyFilter(e.target.value));

document.getElementById('expandAll').addEventListener('click', () => {
  treeEl.querySelectorAll('.node.collapsed').forEach(n => n.classList.remove('collapsed'));
});

document.getElementById('collapseAll').addEventListener('click', () => {
  treeEl.querySelectorAll('.node[data-level="0"], .node[data-level="1"]')
        .forEach(n => n.classList.add('collapsed'));
});

// 快捷键：/ 聚焦搜索，Esc 清空
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) {
    e.preventDefault();
    searchEl.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchEl) {
    searchEl.value = '';
    applyFilter('');
    searchEl.blur();
  }
});
